<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Plaza — Core Product Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  ============================================================================
  PROJECT PLAZA — CORE PRODUCT WORKFLOW
  A presentation where every screen is the live prototype, not a screenshot.
  ============================================================================

  HOW TO RUN
  ----------
  This file must sit INSIDE the project_plaza folder, beside index.html —
  the prototype's product photos and mascot load from files next to it.

  Double-click  Start Plaza Walkthrough.command  in the same folder.
  Or, in Terminal:   cd ~/Downloads/project_plaza && python3 -m http.server 8000
  then open          http://localhost:8000/Project_Plaza_Walkthrough.html

  Serving it (rather than double-clicking this file) is what lets the deck
  drive the prototype's routes without reloading it.

  KEYS
  ----
  → ← Space   next / previous slide          I or click the phone   take control
  1–9 / 0     jump                           Esc                    hand control back
  Cmd+N       speaker notes                  O                      slide grid
  R           reload the prototype           F                      fullscreen
  Cmd/Ctrl+P  speaker notes in a second window (stays in sync with this one)
  T           toggle light / dark background (debug tool, not for presenting)

  On a phone or tablet (no keyboard): swipe left / right on the stage, or
  tap the ‹ › arrows that appear at the screen edges, to move between slides.

  The prototype loads ONCE and stays alive for the whole deck. Slides move it,
  zoom it, and change its route — state you set up on slide 9 is still there on
  slide 27. The only exceptions are slides 3 and 4, which deliberately reload
  to switch verification level.

  EDIT THE CONFIG BLOCK BELOW. Everything under it is machinery.
  ============================================================================
-->

<style>
  /* Figma "Light slides" template: soft gradient ground, near-black Inter, tight tracking. */
  :root {
    --black:      #000000;
    --white:      #ffffff;
    --light-grey: #eeeeee;
    --grey:       #424242;
    --purple:     #8a38f5;
    --violet:     #3d38f5;
    --green:      #198f51;
    --pink:       #f316b0;
    --yellow:     #f3c11b;
    --ink:        #0d0d0d;   /* headers */
    --body-text:  #686868;   /* body copy */
    --stage-w: 1920px;
    --stage-h: 1080px;

    /* theme-switchable values — light mode (default) */
    --page-bg:       #ffffff;
    --stage-overlay: rgba(255,255,255,.25);
    --stage-image:   url('./704d13b1-635f-4255-be45-b331dc9b7fc1.png');
    --stage-fallback:#ffffff;
    --accent-bullet: #7B6EF6;
    --chip-border:   #d6d6d6;
    --chip-open:     #198f51;
    --note-text:     #8a8a8a;
    --slideno-text:  #b0b0b0;
    --rail-track:    rgba(0,0,0,.08);
    --host-border:   #d6d6d6;
    --host-shadow:   rgba(0,0,0,.22);
    --muted-em:      #9a9a9a;
  }

  /* DEBUG TOOL — toggled with the T key or the "Dark" bar button. Restores
     the deck's original dark theme so the two can be compared live. Not
     meant to be left on while presenting. */
  html.dark {
    --page-bg:       var(--black);
    --stage-overlay: rgba(0,0,0,0);
    --stage-image:   none;
    --stage-fallback:var(--black);
    --ink:           var(--white);
    --body-text:     var(--light-grey);
    --accent-bullet: var(--purple);
    --chip-border:   var(--grey);
    --chip-open:     #45c583;
    --note-text:     #8f8f8f;
    --slideno-text:  #6a6a6a;
    --rail-track:    #151515;
    --host-border:   var(--grey);
    --host-shadow:   rgba(255,255,255,.14);
    --muted-em:      #a8a8a8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--page-bg); color: var(--ink);
    font-family: Inter, ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #viewport { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: var(--stage-w); height: var(--stage-h);
    transform-origin: center center; overflow: hidden;
    background:
      linear-gradient(var(--stage-overlay), var(--stage-overlay)),
      var(--stage-image) center / cover no-repeat,
      var(--stage-fallback);
  }

  /* ---------- slides ------------------------------------------------------ */
  .slide {
    position: absolute; inset: 0; padding: 104px 140px;
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .slide.active { opacity: 1; pointer-events: auto; }

  .col { position: absolute; top: 50%; transform: translateY(-50%); }
  .slide.split .col { left: 140px;  width: 800px; }
  .slide.left  .col { left: 880px;  width: 860px; }
  .slide.zoom  .col { left: 140px;  width: 560px; }
  .slide.cover .col,
  .slide.text  .col { left: 140px;  width: 1400px; }

  .cover-mascot {
    position: absolute; top: 50%; right: 150px; transform: translateY(-60%);
    width: 635px; height: auto; pointer-events: none;
  }

  .kicker {
    display: flex; align-items: center; gap: 14px;
    font-size: 20px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--body-text); margin-bottom: 26px;
  }
  .kicker i { width: 12px; height: 12px; background: var(--accent-bullet); flex: 0 0 12px; }

  h1 { font-size: 96px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; margin: 0 0 8px; color: var(--ink); }
  h2 { font-size: 60px; line-height: 1.2; letter-spacing: -.022em; font-weight: 700; margin: 0 0 34px; color: var(--ink); }
  .slide.zoom h2 { font-size: 48px; letter-spacing: -.02em; }
  .lede { font-size: 30px; line-height: 1.36; letter-spacing: -.01em; color: var(--body-text); margin: 0; max-width: 30ch; }
  .slide.cover .lede { max-width: none; white-space: nowrap; }
  .sublede { font-size: 20px; line-height: 1.5; letter-spacing: -.005em; color: var(--body-text); margin: 40px 0 0; max-width: 640px; }

  ul.points { list-style: none; margin: 0; padding: 0; }
  ul.points li {
    position: relative; padding-left: 34px; margin-bottom: 22px;
    font-size: 24px; line-height: 1.34; letter-spacing: -.005em; color: var(--body-text);
  }
  ul.points li:last-child { margin-bottom: 0; }
  ul.points li::before {
    content: ""; position: absolute; left: 0; top: .52em;
    width: 10px; height: 10px; background: var(--accent-bullet);
  }
  ul.points li b { color: var(--ink); }
  ul.points li em { font-style: normal; color: var(--muted-em); }

  .chips { display: flex; gap: 10px; margin-bottom: 26px; flex-wrap: wrap; }
  .chip {
    font-size: 20px; font-weight: 500; letter-spacing: -.01em;
    padding: 7px 16px; border: 1px solid var(--chip-border); color: var(--body-text);
  }
  .chip.locked { border-color: var(--pink); color: var(--pink); }
  .chip.open   { border-color: var(--green); color: var(--chip-open); }

  .note {
    position: absolute; left: 140px; bottom: 84px; width: 1180px;
    font-size: 20px; line-height: 1.4; color: var(--note-text);
  }
  .slide.zoom .note { width: 560px; bottom: 120px; }

  .slide-no {
    position: absolute; right: 16px; bottom: 16px;
    font-size: 20px; color: var(--slideno-text); font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }

  #rail { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--rail-track); }
  #rail div { height: 100%; width: 0; background: var(--purple); transition: width .3s ease; }

  /* ---------- the one, persistent prototype ------------------------------ */
  #appHost {
    position: absolute; overflow: hidden; background: #fff;
    border-radius: 42px; border: 1px solid var(--host-border);
    box-shadow: 0 40px 90px -30px var(--host-shadow);
    transition: left .5s cubic-bezier(.22,.61,.24,1), top .5s cubic-bezier(.22,.61,.24,1),
                width .5s cubic-bezier(.22,.61,.24,1), height .5s cubic-bezier(.22,.61,.24,1),
                opacity .25s ease, border-radius .4s ease;
  }
  #appHost.hidden { opacity: 0; pointer-events: none; }
  #appHost.zoomed { border-radius: 10px; }
  #appFrame {
    position: absolute; top: 0; left: 0; border: 0; background: #fff;
    transform-origin: 0 0; pointer-events: none;
    transition: transform .5s cubic-bezier(.22,.61,.24,1), width .3s ease, height .3s ease;
  }
  #appHost.interactive #appFrame { pointer-events: auto; }
  #appHost.interactive { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple); }

  #shield { position: absolute; inset: 0; cursor: pointer; display: grid; place-items: center; }
  #appHost.interactive #shield { display: none; }
  #shield span {
    opacity: 0; transition: opacity .18s ease;
    background: rgba(0,0,0,.88); color: #fff; font-size: 15px; font-weight: 500;
    padding: 9px 15px; border-radius: 999px;
  }
  #shield:hover span { opacity: 1; }

  .frame-note {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    background: #0e0e0e; color: #9a9a9a; padding: 40px; font-size: 17px; line-height: 1.5;
  }
  .frame-note.show { display: grid; }
  .frame-note code { font-family: ui-monospace, Menlo, monospace; color: #fff; background: #1c1c1c; padding: 2px 6px; }

  /* ---------- bar, notes, overlays --------------------------------------- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 48px; z-index: 40;
    display: flex; align-items: center; gap: 16px; padding: 0 22px;
    background: linear-gradient(to top, rgba(0,0,0,.96), rgba(0,0,0,0));
    font-size: 13px; color: #8f8f8f; opacity: 0; transition: opacity .25s ease;
  }
  #bar.show { opacity: 1; }
  #bar .sec { margin-right: auto; letter-spacing: .06em; text-transform: uppercase; }
  #bar span.num { font-variant-numeric: tabular-nums; }
  #bar button {
    font: inherit; color: #b9b9b9; background: transparent; border: 1px solid #2a2a2a;
    padding: 5px 12px; cursor: pointer;
  }
  #bar button:hover { color: #fff; border-color: #555; }
  #bar button.live { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 600; }

  #notes {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 44vh; overflow: auto; z-index: 45;
    background: rgba(0,0,0,.985); border-top: 1px solid #222; padding: 26px 32px 62px;
    transform: translateY(101%); transition: transform .28s ease;
  }
  #notes.show { transform: translateY(0); }
  #notes h4 { margin: 0 0 14px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--purple); }
  #notes .body { font-size: 17px; line-height: 1.62; color: #dcdcdc; max-width: 100ch; }
  #notes .body b { color: #fff; }
  #notes .body .warn { color: var(--yellow); }

  #overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.985); padding: 44px; overflow: auto; display: none; }
  #overlay.show { display: block; }
  #overlay h3 { margin: 0 0 22px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #8f8f8f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: 12px; }
  .card { border: 1px solid #232323; padding: 15px; cursor: pointer; }
  .card:hover { border-color: var(--purple); }
  .card.on { border-color: var(--white); }
  .card .n { font-size: 11px; color: #777; font-variant-numeric: tabular-nums; margin-bottom: 7px; letter-spacing: .1em; }
  .card .t { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card .r { font-size: 11px; color: #6f6f6f; margin-top: 9px; font-family: ui-monospace, Menlo, monospace; }
  .keys { max-width: 560px; }
  .keys .row { display: flex; gap: 18px; padding: 10px 0; border-bottom: 1px solid #1d1d1d; font-size: 16px; }
  .keys .row b { min-width: 210px; font-family: ui-monospace, Menlo, monospace; font-weight: 400; color: var(--purple); }
  .keys .row span { color: #9a9a9a; }

  /* first-load hint, top-right: confirms the build and the shortcut */
  #hint {
    position: fixed; top: 18px; right: 20px; z-index: 70;
    display: flex; align-items: center; gap: 14px;
    background: rgba(20,20,24,.94); color: #f4f4f5;
    border: 1px solid #33333a; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.35;
    opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }
  #hint.show { opacity: 1; pointer-events: auto; }
  #hint a { color: #c4b5fd; text-decoration: underline; }
  #hint .v { color: #7c7c85; font-variant-numeric: tabular-nums; }
  #hint button { font: inherit; color: #9a9aa2; background: none; border: 0; cursor: pointer; padding: 0 2px; }

  /* ---------- presenter view (?view=notes) -------------------------------- */
  body.presenter { overflow: auto; background: #0b0b0c; color: #f4f4f5; }
  body.presenter #viewport, body.presenter #bar, body.presenter #notes,
  body.presenter #overlay, body.presenter #fileWarn, body.presenter #hint { display: none !important; }

  #pv { display: none; min-height: 100vh; grid-template-rows: auto 1fr auto auto; }
  body.presenter #pv { display: grid; }
  #pvTop { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
           padding: 22px 30px 18px; border-bottom: 1px solid #26262a; }
  #pvTop .num { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #8a8a92; font-variant-numeric: tabular-nums; }
  #pvTop .kicker2 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #a78bfa; }
  #pvTop h2 { font-size: 34px; margin: 0; line-height: 1.15; letter-spacing: -.02em; flex: 1 1 100%; color: #f4f4f5; }
  #pvTop .route { font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: #8a8a92; }
  #pvClock { margin-left: auto; font-size: 30px; font-variant-numeric: tabular-nums; color: #f4f4f5; }
  #pvNotes { color: #e8e8ec; padding: 26px 30px; font-size: 24px; line-height: 1.62; overflow: auto; max-width: 95ch; }
  #pvNotes b { color: #fff; }
  #pvNotes .warn { color: #fbbf24; }
  #pvNotes .empty { color: #6b6b73; font-style: italic; }
  #pvBottom { display: flex; align-items: center; gap: 18px; padding: 16px 30px 22px;
              border-top: 1px solid #26262a; background: #101013; }
  #pvBottom .next { color: #8a8a92; font-size: 17px; flex: 1; }
  #pvBottom .next b { color: #d4d4d8; font-weight: 600; }
  #pvBottom button { font: inherit; font-size: 17px; color: #f4f4f5; background: #1d1d22;
                     border: 1px solid #33333a; border-radius: 10px; padding: 10px 22px; cursor: pointer; }
  #pvBottom button:hover { border-color: #6b6b73; }
  #pvHint { font-size: 14px; color: #6b6b73; padding: 0 30px 18px; }

  /* editable notes: the panel itself is the editor, so what you rehearse
     against is what you type into. Only ever on in the presenter window. */
  #pvNotes[contenteditable="true"] {
    outline: 2px solid #6d5bd0; outline-offset: 8px; border-radius: 6px;
    background: #101018; caret-color: #c4b5fd;
  }
  #pvNotes[contenteditable="true"]:focus { outline-color: #8b7cf0; }
  #pvEditBar { display: flex; align-items: center; gap: 12px; padding: 2px 30px 12px; font-size: 14px; }
  #pvEditBar .dot { width: 8px; height: 8px; border-radius: 50%; background: #34343c; flex: none; }
  #pvEditBar.dirty .dot { background: var(--yellow); }
  #pvEditBar .state { flex: 1; color: #8a8a92; }
  #pvEditBar.dirty .state { color: #d4d4d8; }
  #pvEditBar button { font: inherit; font-size: 14px; color: #cfcfd6; background: #1d1d22;
                      border: 1px solid #33333a; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  #pvEditBar button:hover { border-color: #6b6b73; color: #fff; }
  #pvEditBar button.on { border-color: #8b7cf0; color: #fff; }
  #pvEditBar input[type="file"] { display: none; }

  /* shown only when the deck is opened straight off the disk */
  #fileWarn {
    position: fixed; top: 0; left: 0; right: 0; z-index: 80;
    background: var(--yellow); color: #1a1400;
    padding: 14px 22px; font-size: 15px; line-height: 1.45;
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
  }
  #fileWarn b { font-weight: 700; }
  #fileWarn span { opacity: .72; }

  /* ---------- touch navigation (mobile) ----------------------------------- */
  .nav-btn {
    display: none; position: fixed; top: 50%; transform: translateY(-50%);
    z-index: 35; width: 52px; height: 52px; border-radius: 999px;
    background: rgba(20,20,20,.55); border: 1px solid rgba(255,255,255,.18);
    color: #fff; font-size: 26px; line-height: 1; text-align: center;
    align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent;
  }
  html.touch .nav-btn { display: flex; }
  .nav-prev { left: 14px; }
  .nav-next { right: 14px; }
  .nav-btn:active { background: rgba(138,56,245,.65); }
</style>
</head>
<body>

<script>
/* ============================================================================
   CONFIG
   ========================================================================== */
const CONFIG = {
  app: {
    url: "./index.html",          // the prototype, sitting beside this file
    viewport: { w: 393, h: 852 }, // the prototype's own phone frame
  },

  /* Sheets and overlays the deck closes when you leave a slide, so nothing
     from the previous screen is left hanging over the next one. */
  dismiss: [
    "#nm-close-btn",                 // new-message overlay
    "#send-money-sheet-overlay", "#request-money-sheet-overlay",
    "#request-qr-backdrop", "#attach-overlay",
    "#contact-sheet-overlay", "#member-sheet-overlay", "#qr-overlay",
  ],

  /* Verification level lives in the prototype's localStorage, so the two
     access-state slides are the only ones that reload it. */
  verificationKeys: {
    state: "project-plaza:chat-debug-verification",
    version: "project-plaza:chat-debug-default-version",
    versionValue: "identity-v1",
  },

  /* --------------------------------------------------------------------------
     SLIDES — numbering follows Project_Plaza_Flow_Outline.docx

     layout : "cover" title only · "split" text left, phone right ·
              "left" phone left, text right · "zoom" magnified region ·
              "text" text only
     app    : false | { hash, focus:{x,y,w,h}, clicks:["selector"],
                        call:"windowFn", verification:"phone"|"identity" }
              focus coordinates are in the phone's own 393×852 pixels
              clicks are tapped inside the prototype in order, ~380ms apart —
              this is how sheets that have no route of their own get opened
     -------------------------------------------------------------------------- */
  slides: [
    {
      layout: "cover",
      title: "Project Plaza",
      lede: "Chat, connect, and transact in one place.",
      sublede: "Project Plaza is a chat-first app that brings conversations, buying and selling, money transfers, group collections, identity, and partner services together in one place, so users can manage everyday interactions and transactions without switching between multiple apps.",
      image: "./mascot-bounce.webp",   // 0.9 MB; falls back to the .gif if absent
      app: false,
      notes: "One thing before we start: What we are going to see on the slides is the real prototype, not screenshots. So if a question comes up, we can just go through it by tapping into any of the screens right there.",
    },
    {
      layout: "text",
      kicker: "Table of Contents",
      title: "Plaza App Features",
      points: [
        "Access and Verification States",
        "Chats",
        "Group Chats",
        "Business Chats",
        "Calls Tab",
        "Plaza",
        "Wallet",
        "Profile &amp; Settings",
      ],
      app: false,
      notes: "Here's the running order. We start with access and verification, which covers both phone and identity verification. Then chats and everything we can do inside them, group chats, business chats, the calls tab, Plaza, wallet, and we'll end at profile and settings.",
    },

    /* ── 1. Access & verification states*/
    {
      layout: "split",
      kicker: "Access &amp; Verification",
      title: "Phone-verified (Limited access)",
      chips: [["open", "Chat &amp; messaging"], ["open", "Plaza browsing"], ["locked", "Transactions locked"]],
      points: [
        "Start a conversation and explore Plaza freely",
        "Not allowed to make transactions",
        "Every transaction entry point is hidden or locked",
        "A verification sheet appears if a transaction is attempted",
      ],
      app: { hash: "#/chats", verification: "phone" },
      notes: "Let's start with a user who has only verified their phone number.<br><br>These users will be able to start a conversation and explore Plaza, but they will not be able to make transactions. They can browse through the app freely, while every transaction entry point remains hidden or locked.<br><br>If the user attempts to make a transaction, a bottom sheet will appear and ask them to complete their verification before they can continue.",
    },
    {
      layout: "split",
      kicker: "Access &amp; Verification",
      title: "Fully-verified (Full Access)",
      chips: [["open", "Same chat &amp; Plaza"], ["open", "Send / request money"], ["open", "Wallet"]],
      points: [
        "The same surfaces and features",
        "Sending and requesting money unlocked",
        "Wallet and every payment entry point open",
      ],
      app: { hash: "#/chats", verification: "identity" },
      notes: "For a fully verified user, the surfaces and features are exactly the same. What's different is that they can now make transactions. Sending and requesting money are unlocked, and the wallet and every payment entry point are now open.<br><br>From this point on, everything we will see is from the point of view of a fully verified user.",
    },

    /* ── 2. Chats (Home) ───────────────────── */
    {
      layout: "split",
      kicker: "Chats",
      title: "Chats Home",
      points: [
        "Chat list, filters &amp; search, settings, edit and create-new-message",
        "Pending request cards surface money owed <em>right in the list</em>",
        "Swipe actions: mark read/unread, pin, mute/unmute, delete",
        "Navigation bar and mascot micro-interactions",
        "Quick actions from any page: balance, notifications, assistant, send &amp; request",
      ],
      app: { hash: "#/chats", verification: "identity" },
      notes: "The Chats Home is the main entry point.<br><br>We have the chat list, with filters and search along the top, and the settings, edit, and create new message buttons.<br><br>We also have the pending request cards. These are money requests, or money you owe or are owed, just pulled out of the chat threads. They sit right in the list as a standing reminder so you see them before you open anything.<br><br>Then we have the swipe actions, where you can mark as read or unread, pin, mute or unmute, and delete.<br><br>And lastly, the navigation bar and the mascot. The mascot carries the micro-interactions, which are quick actions you can reach from any page. You can view your wallet balance, check notifications, talk to the smart assistant, and send or request money. So you can do that in any page since it sits along with the navigation bar.",
    },
    {
      layout: "split",
      kicker: "Chats",
      title: "Starting a new conversation",
      points: [
        "Select a contact and start the conversation right away",
        "Create a group chat by selecting members and naming the group",
        "Message a number that isn't on Plaza yet",
        "The recipient gets an SMS to open the app, then the message delivers",
        "Send a reminder, or add a new contact to the list",
      ],

<script>
(() => {
  "use strict";

  const STAGE = { w: 1920, h: 1080 };

  /* Two windows, one deck: the slide window drives the prototype, the presenter
     window shows notes. They stay in step over a BroadcastChannel — same origin,
     so this needs the served copy (the launcher), not file://. */
  const IS_PRESENTER = new URLSearchParams(location.search).get("view") === "notes";
  const chan = (() => { try { return new BroadcastChannel("plaza-deck"); } catch (_) { return null; } })();
  const send = (msg) => { try { chan && chan.postMessage(msg); } catch (_) {} };

  /* Where the phone sits, per layout, in stage coordinates. */
  const SLOTS = {
    split: { x: 1080, y: 60,  w: 700, h: 960 },
    left:  { x: 140,  y: 60,  w: 700, h: 960 },
    zoom:  { x: 780,  y: 90,  w: 1000, h: 900 },
    text:  null,
    cover: null,
  };

  const slides    = CONFIG.slides;
  const viewport  = document.getElementById("viewport");
  const stage     = document.getElementById("stage");
  const host      = document.getElementById("appHost");
  const frame     = document.getElementById("appFrame");
  const shield    = document.getElementById("shield");
  const fnote     = document.getElementById("frameNote");
  const bar       = document.getElementById("bar");
  const secLabel  = document.getElementById("secLabel");
  const countEl   = document.getElementById("count");
  const clockEl   = document.getElementById("clock");
  const railFill  = document.getElementById("railFill");
  const notesEl   = document.getElementById("notes");
  const notesBody = document.getElementById("notesBody");
  const overlay   = document.getElementById("overlay");
  const btnLive   = document.getElementById("btnLive");

  let index = 0, interactive = false, frameLoaded = false, sameOrigin = false;
  let loadCount = 0, overlayMode = null, pendingSlide = null, recoveredFor = -1;

  /* Small ring buffer of routing events — window.__deck.log() to inspect. */
  const debugLog = [];
  function log(...a) { debugLog.push(a.join(" ")); if (debugLog.length > 80) debugLog.shift(); }

  /* Scale the 1920×1080 stage down to the window.
     `zoom` is a layout-level scale, so the iframe inside is laid out at the
     scaled size and stays crisp. A CSS transform is the fallback, but Safari
     mis-paints iframes inside transformed ancestors (ghost copies, wrong
     position), so zoom is strongly preferred. */
  const canZoom = typeof CSS !== "undefined" && CSS.supports && CSS.supports("zoom", "0.5");
  function fitStage() {
    const s = Math.min(innerWidth / STAGE.w, innerHeight / STAGE.h);
    if (canZoom) {
      stage.style.zoom = s;
      stage.style.transform = "none";
    } else {
      stage.style.transform = `scale(${s})`;
    }
  }
  addEventListener("resize", fitStage);
  addEventListener("load", fitStage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitStage);

  /* ---------- slide markup ------------------------------------------------ */
  function renderSlides() {
    document.getElementById("slides").innerHTML = slides.map((s, i) => {
      const b = [];
      if (s.kicker) b.push(`<div class="kicker"><i></i>${s.kicker}</div>`);
      if (s.title)  b.push(s.layout === "cover" ? `<h1>${s.title}</h1>` : `<h2>${s.title}</h2>`);
      if (s.chips)  b.push(`<div class="chips">${s.chips.map(([k, t]) => `<span class="chip ${k}">${t}</span>`).join("")}</div>`);
      if (s.lede)   b.push(`<p class="lede">${s.lede}</p>`);
      if (s.sublede) b.push(`<p class="sublede">${s.sublede}</p>`);
      if (s.points) b.push(`<ul class="points">${s.points.map(p => `<li>${p}</li>`).join("")}</ul>`);
      return `<section class="slide ${s.layout || "text"}" data-i="${i}">
                <div class="col">${b.join("")}</div>
                ${s.image ? `<img class="cover-mascot" src="${s.image}" alt="" onerror="__coverFallback(this)" />` : ""}
                ${s.note ? `<div class="note">${s.note}</div>` : ""}
                <div class="slide-no">${String(i + 1).padStart(2, "0")} / ${slides.length}</div>
              </section>`;
    }).join("");
  }

  /* The mascot has shipped under more than one filename, and a static host
     (Vercel, GitHub Pages) is case-sensitive and only serves what was actually
     committed. Try each candidate in turn, and hide the image rather than
     leave a broken-image icon on the cover slide if none of them resolve. */
  const IMAGE_FALLBACKS = [
    "./mascot-bounce.webp",              // 0.9 MB, same picture — prefer this one
    "./mascot_bounce_transparent.gif",
    "./mascot-bounce.gif",
  ];
  window.__coverFallback = function (img) {
    const tried = (img.dataset.tried || img.getAttribute("src") || "").split("|");
    const next = IMAGE_FALLBACKS.find(u => tried.indexOf(u) === -1);
    if (next) {
      img.dataset.tried = tried.concat(next).join("|");
      log("cover-image:fallback", next);
      img.setAttribute("src", next);
    } else {
      log("cover-image:none");
      img.style.display = "none";
    }
  };

  /* ---------- the persistent prototype ----------------------------------- */
  let reloadTicket = 0;

  /* A genuine reload of the prototype at a given route.
     Assigning src only changes the fragment — the browser treats that as a
     same-document navigation and never fires load — so go through the
     iframe's own location and reload, with a src fallback if that's blocked. */
  function loadFrame(hash) {
    frameLoaded = false;
    const ticket = ++reloadTicket;
    let reloading = false;

    if (sameOrigin) {
      try {
        const w = frame.contentWindow;
        w.location.hash = hash || "";
        w.location.reload();
        reloading = true;
      } catch (_) { reloading = false; }
    }
    if (!reloading) frame.setAttribute("src", CONFIG.app.url + (hash || ""));

    // Watchdog: if no load event lands, force a fresh navigation.
    setTimeout(() => {
      if (frameLoaded || ticket !== reloadTicket) return;
      log("loadFrame:watchdog", hash || "");
      frame.setAttribute("src", `${CONFIG.app.url}?r=${ticket}${hash || ""}`);
    }, 6000);
  }

  /* The prototype remembers where it was — including which chat a half-opened
     request sheet belonged to — and that memory outranks the route we ask for.
     Since the deck always states the route explicitly, drop the memory first. */
  function clearSavedRoute() {
    if (!sameOrigin) return;
    try {
      const w = frame.contentWindow;
      w.localStorage.removeItem("project-plaza:last-location");
      w.localStorage.removeItem("project-plaza:last-route");
      w.sessionStorage.removeItem("project-plaza:last-route");
      /* Light is the prototype default, but a previous session on this
         browser can leave Dark Mode saved. Pin it so the deck is
         deterministic on any machine. */
      w.localStorage.setItem("project-plaza:theme", "Light Mode");
    } catch (_) {}
  }

  function bootFrame() {
    frame.addEventListener("load", () => {
      loadCount++;
      frameLoaded = true;
      fnote.classList.remove("show");
      try {
        void frame.contentWindow.location.href;
        sameOrigin = true;
        frame.contentWindow.document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") setInteractive(false);
        });
        bindPresenterKey(frame.contentWindow.document);
      } catch (_) { sameOrigin = false; }

      const slide = slides[pendingSlide != null ? pendingSlide : index];
      pendingSlide = null;
      // Verification is read at boot — if this slide needs a different level,
      // set it and reload once. needsVerificationReload() writes the value
      // before returning true, so this can't loop.
      if (needsVerificationReload(slide)) { loadFrame(slide.app.hash); return; }
      applyAppState(slide, true);
    });

    const first = slides.find(s => s.app && s.app.hash);
    loadFrame(first ? first.app.hash : "#/chats");

    setTimeout(() => {
      if (frameLoaded) return;
      fnote.classList.add("show");
      fnote.innerHTML = `<div>The prototype didn't load.<br><br>
        This file has to sit inside the <code>project_plaza</code> folder, beside
        <code>index.html</code>, and the folder has to be served:<br><br>
        <code>cd ~/Downloads/project_plaza &amp;&amp; python3 -m http.server 8000</code><br><br>
        Then open <code>localhost:8000/Project_Plaza_Walkthrough.html</code> · press <code>R</code> to retry.</div>`;
    }, 8000);
  }

  /* Preferred path: the prototype exposes setCurrentSimulationLevel(), which
     switches level in place. Going up to identity it also calls
     restoreIdentityVerifiedPopulatedState(), which is what repopulates the
     chat list after the phone-verified slides put it in new-account mode.
     No reload, so nothing else on the slide is disturbed. */
  function setVerificationLive(want) {
    if (!want || !sameOrigin || !frameLoaded) return false;
    try {
      const w = frame.contentWindow;
      if (typeof w.setCurrentSimulationLevel !== "function") return false;
      w.localStorage.setItem(CONFIG.verificationKeys.version, CONFIG.verificationKeys.versionValue);
      w.setCurrentSimulationLevel(want);
      if (typeof w.applyChatVerificationState === "function") w.applyChatVerificationState();
      log("verification:live", want);
      return true;
    } catch (_) { return false; }
  }

  /* Fallback for builds without that function: the level is read at boot, so
     changing it there means one reload. */
  function needsVerificationReload(slide) {
    const want = slide.app && slide.app.verification;
    if (!want || !sameOrigin || !frameLoaded) return false;
    if (setVerificationLive(want)) return false;
    try {
      const ls = frame.contentWindow.localStorage;
      const cur = JSON.parse(ls.getItem(CONFIG.verificationKeys.state) || "null");
      if (cur && cur.current === want) return false;
      ls.setItem(CONFIG.verificationKeys.version, CONFIG.verificationKeys.versionValue);
      ls.setItem(CONFIG.verificationKeys.state,
        JSON.stringify({ current: want, participant: "identity" }));
      // Phone-verified puts the build in fresh-account mode and that sticks in
      // session storage — clear it, or the chat list stays empty afterwards.
      try { frame.contentWindow.sessionStorage.removeItem("project-plaza:first-time-email-chats"); } catch (_) {}
      return true;
    } catch (_) { return false; }
  }

  function applyAppState(slide, initial) {
    const cfg = slide && slide.app;
    if (!cfg) return;
    if (!frameLoaded) { pendingSlide = index; return; }   // apply once it lands
    const w = frame.contentWindow;
    clearSavedRoute();

    if (cfg.hash) {
      if (sameOrigin) {
        const want = cfg.hash.split("?")[0];
        const set = () => {
          try {
            // The prototype rewrites its own hash when a sheet closes, so
            // compare on the path (it appends its own query params) and
            // re-assert if it drifted.
            if (w.location.hash.split("?")[0] !== want) w.location.hash = cfg.hash;
          } catch (_) { post({ type: "deck:navigate", to: cfg.hash }); }
        };
        set();
        [260, 620, 1100].forEach(t => setTimeout(set, t));
      } else {
        post({ type: "deck:navigate", to: cfg.hash });
      }
    }
    // Some screens are only reachable through a function the app exposes.
    if (cfg.call && sameOrigin) {
      setTimeout(() => { try { w[cfg.call] && w[cfg.call](); } catch (_) {} }, initial ? 500 : 340);
    }
    if (cfg.hash) verifyRoute(slide);

    // Sheets (send money, request money, QR, link) have no route of their own —
    // the deck taps the same controls a presenter would.
    if (cfg.clicks && sameOrigin) {
      cfg.clicks.forEach((sel, n) => setTimeout(() => {
        try {
          const el = w.document.querySelector(sel);
          if (el) el.click();
        } catch (_) {}
      }, (initial ? 620 : 420) + n * 400));
    }
  }

  /* Safety net. Dismissing a sheet can leave the prototype's own router mid-
     restore, after which it stops responding to route changes. If a slide's
     screen didn't take, reload the prototype straight at it — once per visit. */
  function verifyRoute(slide) {
    const cfg = slide.app;
    if (!cfg || !cfg.hash || !sameOrigin) return;
    const target = index, want = cfg.hash.split("?")[0];
    setTimeout(() => {
      if (index !== target) return log("verify:moved-on", target);
      if (recoveredFor === target) return log("verify:already", target);
      if (!frameLoaded) return log("verify:not-loaded", target);
      try {
        const cur = frame.contentWindow.location.hash.split("?")[0];
        if (cur === want) return log("verify:ok", target);
        recoveredFor = target;
        pendingSlide = target;
        log("verify:recover", target, cur + " -> " + want);
        loadFrame(cfg.hash);
      } catch (e) { log("verify:threw", target, e.message); }
    }, 1600);
  }

  function dismissOverlays() {
    if (!sameOrigin || !frameLoaded) return false;
    let closed = false;
    try {
      const d = frame.contentWindow.document;
      (CONFIG.dismiss || []).forEach(sel => {
        const el = d.querySelector(sel);
        if (el && el.getClientRects().length) { el.click(); closed = true; }
      });
    } catch (_) {}
    return closed;   // closing a sheet makes the app rewrite its own route
  }

  function post(msg) { try { frame.contentWindow.postMessage(msg, "*"); } catch (_) {} }

  function placeApp(slide) {
    const slot = slide.app === false ? null : SLOTS[slide.layout || "text"];
    if (!slot) { host.classList.add("hidden"); return; }
    host.classList.remove("hidden");

    const vp = (slide.app && slide.app.viewport) || CONFIG.app.viewport;
    frame.style.width = vp.w + "px";
    frame.style.height = vp.h + "px";

    const f = (slide.app && slide.app.focus) || { x: 0, y: 0, w: vp.w, h: vp.h };
    host.classList.toggle("zoomed", !!(slide.app && slide.app.focus));

    const s = Math.min(slot.w / f.w, slot.h / f.h);
    const w = Math.round(f.w * s), h = Math.round(f.h * s);
    host.style.left = Math.round(slot.x + (slot.w - w) / 2) + "px";
    host.style.top = Math.round(slot.y + (slot.h - h) / 2) + "px";
    host.style.width = w + "px";
    host.style.height = h + "px";
    frame.style.transform = `translate(${-f.x * s}px, ${-f.y * s}px) scale(${s})`;
  }

  /* ---------- interaction handoff ---------------------------------------- */
  function setInteractive(on) {
    interactive = on && !host.classList.contains("hidden");
    host.classList.toggle("interactive", interactive);
    btnLive.classList.toggle("live", interactive);
    btnLive.textContent = interactive ? "Exit (Esc)" : "Interact";
    if (interactive) { try { frame.contentWindow.focus(); } catch (_) {} }
    else { window.focus(); document.body.focus(); }
  }
  shield.addEventListener("click", () => setInteractive(true));
  btnLive.addEventListener("click", () => setInteractive(!interactive));
  document.addEventListener("mousedown", (e) => {
    if (interactive && !host.contains(e.target) && !bar.contains(e.target)) setInteractive(false);
  });

  /* ---------- navigation ------------------------------------------------- */
  /* ---------- editable speaker notes ------------------------------------
     Notes you type in the presenter window are kept per slide in this
     browser's localStorage and broadcast to the slide window, so the Cmd+N panel
     and the presenter panel never disagree. The slide definitions above are
     never rewritten — "Revert this slide" just drops the draft. */
  const DRAFT_KEY = "plaza-deck:notes";
  let drafts = (() => {
    try { const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}"); return (d && typeof d === "object") ? d : {}; }
    catch (_) { return {}; }
  })();
  let editing = false, saveT = 0, pending = null;

  const baseNote = (i) => String((slides[i] || {}).notes || "");
  const noteFor  = (i) => (typeof drafts[i] === "string" ? drafts[i] : baseNote(i));
  const isEdited = (i) => typeof drafts[i] === "string";
  function persistDrafts() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch (_) {} }

  function go(i, fromHash, fromChannel) {
    if (pending) flushNote();          // don't lose a half-typed edit on nav
    index = Math.max(0, Math.min(slides.length - 1, i));
    recoveredFor = -1;
    const s = slides[index];

    document.querySelectorAll(".slide").forEach(el =>
      el.classList.toggle("active", +el.dataset.i === index));

    secLabel.innerHTML = (s.kicker || "").replace(/&amp;/g, "&");
    countEl.textContent = `${index + 1} / ${slides.length}`;
    railFill.style.width = ((index + 1) / slides.length * 100) + "%";
    notesBody.innerHTML = noteFor(index) || "—";

    setInteractive(false);
    const closed = dismissOverlays();
    placeApp(s);

    if (needsVerificationReload(s)) {
      pendingSlide = index;
      loadFrame(s.app.hash);          // deliberate: slides 3 and 4 only
    } else if (closed) {
      // Let the sheet finish closing before routing, or its own route
      // rewrite lands on top of ours.
      const target = index;
      setTimeout(() => { if (index === target) applyAppState(s, false); }, 280);
    } else {
      applyAppState(s, false);
    }

    if (IS_PRESENTER) renderPresenter();
    if (!fromChannel) send({ type: "slide", index });
    if (overlayMode === "grid") renderGrid();
    if (!fromHash) location.hash = "#" + (index + 1);
  }

  addEventListener("hashchange", () => {
    const n = parseInt(location.hash.slice(1), 10);
    if (!isNaN(n) && n - 1 !== index) go(n - 1, true);
  });

  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && (k === "n" || k === "N")) {
      if (!editing && !(e.target && e.target.isContentEditable) && !interactive) {
        notesEl.classList.toggle("show");
      }
      e.preventDefault();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // While the notes are being typed into, the keyboard belongs to the editor.
    if (editing || (e.target && e.target.isContentEditable)) {
      if (k === "Escape") { setEditing(false); e.preventDefault(); }
      return;
    }
    if (k === "Escape") {
      if (overlayMode) { closeOverlay(); e.preventDefault(); return; }
      if (interactive) { setInteractive(false); e.preventDefault(); return; }
    }
    if (interactive) return;

    switch (k) {
      case "ArrowRight": case "ArrowDown": case " ": case "PageDown":
        go(index + 1); e.preventDefault(); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp":
        go(index - 1); e.preventDefault(); break;
      case "Home": go(0); break;
      case "End": go(slides.length - 1); break;
      case "e": case "E": if (IS_PRESENTER) { setEditing(true); e.preventDefault(); } break;
      case "o": case "O": overlayMode === "grid" ? closeOverlay() : openGrid(); break;
      case "?": case "/": overlayMode === "help" ? closeOverlay() : openHelp(); break;
      case "i": case "I": setInteractive(true); e.preventDefault(); break;
      case "r": case "R": loadFrame(slides[index].app && slides[index].app.hash); break;
      case "f": case "F":
        document.fullscreenElement ? document.exitFullscreen()
                                   : document.documentElement.requestFullscreen();
        break;
      case "t": case "T": toggleTheme(); break;
      default: if (/^[0-9]$/.test(k)) go(k === "0" ? 9 : +k - 1);
    }
  });

  /* ---------- debug: light / dark theme toggle --------------------------- */
  // Not part of the presentation flow — a quick way to flip the deck's
  // background and text colors back to the original dark theme, live, so
  // the two can be compared side by side. Nothing here persists on reload.
  const btnTheme = document.getElementById("btnTheme");
  function toggleTheme() {
    const dark = document.documentElement.classList.toggle("dark");
    btnTheme.textContent = dark ? "Light" : "Dark";
    btnTheme.classList.toggle("live", dark);
  }
  btnTheme.addEventListener("click", toggleTheme);

  /* ---------- touch navigation (mobile) ----------------------------------- */
  // No hardware keyboard on a phone, so give touch users an explicit way to
  // move between slides: on-screen prev/next buttons, plus a swipe gesture
  // across the stage. Both defer to the same guards as the keyboard handler
  // (skip while interacting with the live prototype or with an overlay open).
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    document.documentElement.classList.add("touch");
  }

  const navPrev = document.getElementById("navPrev");
  const navNext = document.getElementById("navNext");
  navPrev.addEventListener("click", () => { if (!interactive) go(index - 1); });
  navNext.addEventListener("click", () => { if (!interactive) go(index + 1); });

  let touchStartX = 0, touchStartY = 0, touchStartT = 0;
  viewport.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
  }, { passive: true });

  viewport.addEventListener("touchend", (e) => {
    if (interactive || overlayMode) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dt = Date.now() - touchStartT;
    if (dt > 800) return;                          // too slow to be a swipe
    if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    dx < 0 ? go(index + 1) : go(index - 1);
  }, { passive: true });

  /* ---------- overlays --------------------------------------------------- */
  function openGrid() { overlayMode = "grid"; renderGrid(); overlay.classList.add("show"); }
  function openHelp() { overlayMode = "help"; renderHelp(); overlay.classList.add("show"); }
  function closeOverlay() { overlayMode = null; overlay.classList.remove("show"); }

  function strip(s) { return String(s || "").replace(/<[^>]*>/g, "").replace(/&amp;/g, "&"); }

  function renderGrid() {
    overlay.innerHTML = `<h3>Slides — click to jump, Esc to close</h3><div class="grid">${
      slides.map((s, i) => `<div class="card ${i === index ? "on" : ""}" data-i="${i}">
        <div class="n">${String(i + 1).padStart(2, "0")} · ${strip(s.kicker)}</div>
        <div class="t">${strip(s.title)}</div>
        <div class="r">${s.app === false ? "—" : (s.app.hash || "")}</div></div>`).join("")}</div>`;
    overlay.querySelectorAll(".card").forEach(c =>
      c.addEventListener("click", () => { go(+c.dataset.i); closeOverlay(); }));
  }

  function renderHelp() {
    const rows = [
      ["→ ↓ Space", "Next slide"], ["← ↑", "Previous slide"], ["1–9, 0", "Jump to slide"],
      ["I  or click the phone", "Take control of the prototype"],
      ["Esc", "Hand control back to the deck"], ["⌘N", "Speaker notes"],
      ["⌘P / Ctrl+P", "Open speaker notes in a second window"],
      ["E  (presenter window)", "Edit this slide's speaker notes"],
      ["O", "Slide grid"], ["R", "Reload the prototype at this slide's screen"], ["F", "Fullscreen"],
      ["T", "Debug: toggle light / dark background"],
    ];
    overlay.innerHTML = `<h3>Keyboard</h3><div class="keys">${
      rows.map(([k, v]) => `<div class="row"><b>${k}</b><span>${v}</span></div>`).join("")}</div>`;
  }

  document.getElementById("btnPresenter").addEventListener("click", openPresenter);
  document.getElementById("btnGrid").addEventListener("click", () => overlayMode === "grid" ? closeOverlay() : openGrid());
  document.getElementById("btnHelp").addEventListener("click", () => overlayMode === "help" ? closeOverlay() : openHelp());

  /* ---------- presenter view --------------------------------------------- */
  function renderPresenter() {
    const s = slides[index], nxt = slides[index + 1];
    const t = (x) => String(x == null ? "" : x).replace(/&amp;/g, "&");
    document.getElementById("pvNum").textContent = String(index + 1).padStart(2, "0") + " / " + slides.length;
    document.getElementById("pvKicker").innerHTML = s.kicker || "";
    document.getElementById("pvTitle").innerHTML = s.title || "";
    document.getElementById("pvRoute").textContent = s.app === false ? "no phone" : ((s.app && s.app.hash) || "");
    const nEl = document.getElementById("pvNotes");
    nEl.innerHTML = noteFor(index) || '<span class="empty">No notes on this slide.</span>';
    setEditing(false);
    updateEditBar();
    document.getElementById("pvNext").innerHTML = nxt ? "Next — <b>" + t(nxt.title) + "</b>"
                                                     : "<b>Last slide.</b> Questions from here.";
    document.getElementById("pvNotes").scrollTop = 0;
  }

  function flushNote() {
    clearTimeout(saveT);
    if (!pending) return;
    const { i, html } = pending;
    pending = null;
    const clean = html.replace(/<br\s*\/?>\s*$/i, "").trim();
    const bare  = clean.replace(/<[^>]*>/g, "").trim();
    if (!bare || clean === baseNote(i).trim()) delete drafts[i];
    else drafts[i] = clean;
    persistDrafts();
    send({ type: "notes", index: i, html: isEdited(i) ? drafts[i] : null });
    updateEditBar();
  }

  function setEditing(on) {
    if (!IS_PRESENTER) return;
    const nEl = document.getElementById("pvNotes");
    if (on && nEl.querySelector(".empty")) nEl.innerHTML = "";
    editing = !!on;
    nEl.setAttribute("contenteditable", editing ? "true" : "false");
    nEl.setAttribute("spellcheck", "true");
    if (editing) nEl.focus();
    else { nEl.blur(); flushNote(); }
    const btn = document.getElementById("pvEdit");
    if (btn) { btn.classList.toggle("on", editing); btn.textContent = editing ? "Done" : "Edit notes"; }
    updateEditBar();
  }

  function updateEditBar() {
    const bar = document.getElementById("pvEditBar");
    if (!bar) return;
    const edited = isEdited(index), n = Object.keys(drafts).length;
    bar.classList.toggle("dirty", edited);
    document.getElementById("pvState").textContent = editing
      ? "Editing this slide — Esc when done"
      : edited ? "Edited" + (n > 1 ? " · " + n + " slides changed" : "")
               : n ? n + (n === 1 ? " slide" : " slides") + " edited elsewhere"
                   : "Double-click the notes to edit";
    document.getElementById("pvRevert").style.display = edited ? "" : "none";
    document.getElementById("pvBackup").style.display = n ? "" : "none";
  }

  function revertSlide() {
    clearTimeout(saveT); pending = null;
    delete drafts[index];
    persistDrafts();
    send({ type: "notes", index, html: null });
    renderPresenter();
  }

  function backupNotes() {
    const payload = { app: "project-plaza-deck", kind: "speaker-notes", slides: slides.length, notes: {} };
    Object.keys(drafts).forEach(i => { payload.notes[i] = { title: strip(slides[i] && slides[i].title), html: drafts[i] }; });
    const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "Plaza presenter notes.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function restoreNotes(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const src = (d && d.notes) || {};
        let n = 0;
        Object.keys(src).forEach(k => {
          const html = typeof src[k] === "string" ? src[k] : (src[k] && src[k].html);
          if (typeof html === "string") { drafts[k] = html; n++; send({ type: "notes", index: +k, html }); }
        });
        persistDrafts();
        renderPresenter();
        document.getElementById("pvState").textContent = "Restored " + n + (n === 1 ? " slide" : " slides");
      } catch (_) {
        document.getElementById("pvState").textContent = "That file isn't a notes backup";
      }
    };
    r.readAsText(file);
  }

  function presenterURL() { return location.origin + location.pathname + "?view=notes#" + (index + 1); }
  function openPresenter() {
    const w = window.open(presenterURL(), "plaza-presenter", "width=1100,height=800");
    if (w) startWorkflowTimer();
    if (!w) showHint(true);          // no dialogs — fall back to a clickable link
  }
  function showHint(persist) {
    const h = document.getElementById("hint");
    if (!h) return;
    document.getElementById("hintLink").setAttribute("href", presenterURL());
    h.classList.add("show");
    if (!persist) setTimeout(() => h.classList.remove("show"), 7000);
  }

  /* The prototype runs in an iframe; once it has focus, key events never reach
     this document. Catch deck-level shortcuts inside the frame too.
     preventDefault stops the browser's own new-window / print actions — this
     is best-effort; some browsers (notably Safari) can still show it. */
  function bindPresenterKey(doc) {
    if (!doc || doc.__pvBound) return;
    doc.__pvBound = true;
    doc.addEventListener("keydown", (e) => {
      if (e.altKey || e.shiftKey) return;
      if (!(e.metaKey || e.ctrlKey)) return;
      if (e.target && e.target.isContentEditable) return;
      if (doc !== document && e.metaKey && !e.ctrlKey && (e.key === "n" || e.key === "N")) {
        if (!editing && !interactive) notesEl.classList.toggle("show");
        e.preventDefault();
        return;
      }
      if ((e.key === "p" || e.key === "P") && !IS_PRESENTER) { openPresenter(); e.preventDefault(); }
    }, true);
  }
  bindPresenterKey(document);

  if (chan) {
    chan.onmessage = (e) => {
      const m = e.data || {};
      if (m.type === "slide" && m.index !== index) go(m.index, true, true);
      if (m.type === "nav") go(m.index, false, false);
      if (m.type === "notes") {
        if (m.html == null) delete drafts[m.index]; else drafts[m.index] = m.html;
        persistDrafts();
        if (m.index === index && !editing) {
          notesBody.innerHTML = noteFor(index) || "—";
          if (IS_PRESENTER) renderPresenter();
        }
        if (IS_PRESENTER) updateEditBar();
      }
      if (m.type === "hello") send({ type: "slide", index });
    };
  }

  if (IS_PRESENTER) {
    document.body.classList.add("presenter");
    document.title = "Presenter notes — Project Plaza";
    const nEl = document.getElementById("pvNotes");
    nEl.addEventListener("dblclick", () => setEditing(true));
    nEl.addEventListener("input", () => {
      pending = { i: index, html: nEl.innerHTML };
      clearTimeout(saveT);
      saveT = setTimeout(flushNote, 400);
    });
    nEl.addEventListener("blur", () => { if (editing) setEditing(false); });
    document.getElementById("pvEdit").addEventListener("click", () => setEditing(!editing));
    document.getElementById("pvRevert").addEventListener("click", revertSlide);
    document.getElementById("pvBackup").addEventListener("click", backupNotes);
    const fileEl = document.getElementById("pvFile");
    document.getElementById("pvRestoreBtn").addEventListener("click", () => fileEl.click());
    fileEl.addEventListener("change", () => { if (fileEl.files[0]) restoreNotes(fileEl.files[0]); fileEl.value = ""; });
    window.addEventListener("beforeunload", flushNote);
    document.getElementById("pvPrev").addEventListener("click", () => go(index - 1));
    document.getElementById("pvNextBtn").addEventListener("click", () => go(index + 1));
    const t0 = Date.now();
    setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      document.getElementById("pvClock").textContent =
        String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
    }, 1000);
    send({ type: "hello" });
  }

  /* ---------- bar + timer ------------------------------------------------ */
  let hideT;
  const poke = () => {
    bar.classList.add("show");
    clearTimeout(hideT);
    hideT = setTimeout(() => bar.classList.remove("show"), 2600);
  };
  document.addEventListener("mousemove", poke);
  poke();
  let workflowT0 = null, workflowTimer = null;
  function updateWorkflowClock() {
    const s = workflowT0 == null ? 0 : Math.floor((Date.now() - workflowT0) / 1000);
    clockEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }
  function startWorkflowTimer() {
    if (IS_PRESENTER || workflowTimer) return;
    workflowT0 = Date.now();
    updateWorkflowClock();
    workflowTimer = setInterval(updateWorkflowClock, 1000);
  }
  updateWorkflowClock();

  /* Opened by double-clicking the file? Say so, loudly — on file:// the deck
     can't drive the prototype's screens and iframes render unreliably. */
  function checkProtocol() {
    if (location.protocol !== "file:") return;
    const b = document.createElement("div");
    b.id = "fileWarn";
    b.innerHTML = "Opened as a file — the deck can't switch the prototype's screens." +
      "<b>Quit this tab and double-click “Start Plaza Walkthrough.command” instead</b>" +
      "<span>(it serves this folder at localhost, which is what lets the slides drive the app)</span>";
    document.body.appendChild(b);
  }

  /* ---------- go --------------------------------------------------------- */
  fitStage();
  if (IS_PRESENTER) document.body.classList.add("presenter");
  checkProtocol();
  renderSlides();
  if (!IS_PRESENTER) bootFrame();   // the prototype lives in the slide window only
  const start = parseInt(location.hash.slice(1), 10);
  go(isNaN(start) ? 0 : start - 1, true);

  if (!IS_PRESENTER) {
    const hc = document.getElementById("hintClose");
    if (hc) hc.addEventListener("click", () => document.getElementById("hint").classList.remove("show"));
    const hl = document.getElementById("hintLink");
    if (hl) hl.addEventListener("click", () => { hl.setAttribute("href", presenterURL()); startWorkflowTimer(); });
    setTimeout(() => showHint(false), 900);
  }

  window.__deck = {
    get index() { return index; }, get loadCount() { return loadCount; },
    get sameOrigin() { return sameOrigin; }, go,
    log: () => debugLog.slice(),
  };
})();
</script>
</body>
</html>
